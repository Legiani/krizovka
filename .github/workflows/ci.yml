name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/legiani/krizovka

jobs:
  test-and-build:
    name: Test and Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run .NET Tests
        run: dotnet test backend/Krizovka.slnx -c Release

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build Next.js Admin
        run: npm run build:admin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Run Flutter Client Tests
        run: |
          cd apps/client
          flutter pub get
          flutter test

      - name: Build Flutter Web Client
        run: |
          cd apps/client
          flutter build web --release

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: apps/client/build/web
          retention-days: 1

  build-and-push-images:
    name: Build & Push Docker Images
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Flutter Web Build
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: apps/client/build/web

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Krizovka.Api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:latest
            ${{ env.IMAGE_PREFIX }}/api:sha-${{ github.sha }}

      - name: Build & Push Users Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/recycled/src/Services/US/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/users:latest
            ${{ env.IMAGE_PREFIX }}/users:sha-${{ github.sha }}

      - name: Build & Push Admin Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/admin:latest
            ${{ env.IMAGE_PREFIX }}/admin:sha-${{ github.sha }}

      - name: Build & Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/client/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/client:latest
            ${{ env.IMAGE_PREFIX }}/client:sha-${{ github.sha }}
