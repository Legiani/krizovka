<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krizové situace na vysoké škole</title>
<style>
:root{
  --bg:#F4F8FD; --surface:#FFFFFF; --ink:#0B2A4A; --blue:#1F5FAD; --soft:#E4EEF9; --muted:#4A607A; --line:#C9D8EA;
  --bar:#0B2A4A; --bar-ink:#FFFFFF; --sos:#C62828; --dont:#B3261E; --dont-bg:#FCEBEA; --miss:#C00000; --focus:#F2A900;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#081A2E; --surface:#0F2640; --ink:#E8F0FA; --blue:#7FB0EB; --soft:#16345A; --muted:#9FB5CE; --line:#244669;
    --bar:#051222; --dont:#F2877F; --dont-bg:#3A1714; --miss:#FF8A80; --focus:#FFC940;
  }
}
:root[data-theme="dark"]{
  --bg:#081A2E; --surface:#0F2640; --ink:#E8F0FA; --blue:#7FB0EB; --soft:#16345A; --muted:#9FB5CE; --line:#244669;
  --bar:#051222; --dont:#F2877F; --dont-bg:#3A1714; --miss:#FF8A80; --focus:#FFC940;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:1.0625rem;line-height:1.55}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.sos{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);border-bottom:4px solid var(--blue)}
.sos-in{max-width:820px;margin:0 auto;padding:.5rem 1rem;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.sos-label{font-weight:800;margin-right:auto;font-size:.95rem}
.sos .n{display:inline-flex;align-items:baseline;gap:.3rem;text-decoration:none;background:var(--sos);color:#fff;padding:.2rem .55rem;border-radius:4px;font-weight:800}
.sos .n small{font-weight:400;font-size:.72rem}
.local{max-width:820px;margin:0 auto;padding:0 1rem .5rem;display:flex;gap:.4rem 1rem;flex-wrap:wrap;font-size:.88rem}
.local a{color:#fff;font-weight:700}
.local b{font-weight:800}
.local .missing{color:#FFB4AB;font-weight:700}
.local-label{font-weight:800;letter-spacing:.01em}

main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
h1{font-size:clamp(1.6rem,5vw,2.3rem);line-height:1.12;margin:.2rem 0 .7rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;margin:1.6rem 0 .5rem;color:var(--blue)}
p{max-width:66ch;margin:.5rem 0}
.lead{font-size:1.12rem;color:var(--muted)}
.hero{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--blue);border-radius:12px;padding:1.2rem}

.crumbs{display:flex;flex-wrap:wrap;gap:.25rem .5rem;font-size:.9rem;color:var(--muted);margin-bottom:.4rem}
.crumbs button{background:none;border:0;padding:0;color:var(--blue);font:inherit;text-decoration:underline;cursor:pointer}
.crumbs .sep{opacity:.6}

.choices{display:grid;gap:.55rem;margin:1rem 0;padding:0;list-style:none}
@media (min-width:640px){.choices.two{grid-template-columns:1fr 1fr}}
.choice{width:100%;height:100%;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:.85rem 1rem;font:inherit;cursor:pointer}
.choice:hover:not([disabled]){border-color:var(--blue);background:var(--soft)}
.choice[disabled]{opacity:.5;cursor:not-allowed}
.choice .t{display:block;font-weight:700}
.choice .d{display:block;color:var(--muted);font-size:.93rem}
.choice.crit{border-left:6px solid var(--sos)}
.tag{display:inline-block;font-size:.76rem;padding:.05rem .45rem;border-radius:4px;margin-left:.4rem;background:var(--line);color:var(--ink);font-weight:700}
.tag.ready{background:#E3F2E8;color:#2E7D4F}
.filter{width:100%;font:inherit;padding:.65rem .9rem;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}

.now{background:var(--surface);border:2px solid var(--blue);border-radius:12px;padding:.2rem 1rem .9rem;margin:1rem 0}
.now h2{margin-top:.9rem}
ol.first{counter-reset:s;list-style:none;padding:0;margin:.4rem 0}
ol.first li{counter-increment:s;position:relative;padding:.4rem 0 .4rem 2.6rem;max-width:64ch;border-top:1px solid var(--line)}
ol.first li:first-child{border-top:0}
ol.first li::before{content:counter(s);position:absolute;left:0;top:.45rem;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.95rem}
.usb{display:flex;gap:.5rem;flex-wrap:wrap;margin:.8rem 0 .2rem}
.usb span{flex:1 1 30%;text-align:center;background:var(--soft);border:1px solid var(--blue);border-radius:8px;padding:.35rem .5rem;font-weight:800;color:var(--blue);font-size:.95rem}
.call{display:inline-block;background:var(--sos);color:#fff;text-decoration:none;font-weight:800;border-radius:6px;padding:0 .45rem}
.loc{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700;border-radius:6px;padding:0 .45rem}
.loc.missing{background:transparent;color:var(--miss);border:1px dashed var(--miss)}

details{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:.5rem 0;overflow:hidden}
details[open]{border-color:var(--blue)}
summary{cursor:pointer;padding:.75rem 1rem;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:1rem;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-weight:800;font-size:1.2rem;color:var(--blue)}
details[open] summary::after{content:"–"}
details.dont summary{color:var(--dont)}
details.ks{border-color:var(--ink)} details.ks summary{background:var(--soft)}
.body{padding:.2rem 1rem 1rem}
.body ul{padding-left:1.15rem;margin:.3rem 0}
.body li{margin:.3rem 0;max-width:64ch}
details.dont li::marker{color:var(--dont)}
.spec{background:var(--soft);border-left:5px solid var(--blue);border-radius:6px;padding:.6rem .9rem;margin:.5rem 0}
.spec strong{color:var(--blue)}
.prio{background:var(--dont-bg);border:2px solid var(--sos);border-radius:10px;padding:.7rem .9rem;margin:.6rem 0 1rem;font-weight:600}
.prio strong{color:var(--sos);display:block;margin-bottom:.15rem}
.bang{color:var(--dont);font-weight:800}
.checknote{background:var(--soft);border-left:5px solid var(--blue);border-radius:6px;padding:.6rem .9rem}
details.warn{border-color:var(--sos)} details.warn summary{color:var(--dont);background:var(--dont-bg)}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:460px}
th,td{text-align:left;padding:.5rem .65rem;border-bottom:1px solid var(--line);vertical-align:top;font-size:.95rem}
th{background:var(--ink);color:var(--bg);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.3rem}
.btn{font:inherit;font-weight:700;border-radius:8px;padding:.7rem 1.2rem;cursor:pointer;border:2px solid var(--blue)}
.btn.primary{background:var(--blue);color:#fff}
.btn.ghost{background:transparent;color:var(--blue)}
.note{font-size:.9rem;color:var(--muted);border-top:1px solid var(--line);margin-top:2.4rem;padding-top:1rem}
.theme-t{background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:.85rem;border-radius:6px;padding:.2rem .6rem;cursor:pointer}
.logos{display:flex;flex-wrap:wrap;align-items:center;gap:1.5rem;margin:1.6rem 0 .6rem;padding-top:1.2rem;border-top:1px solid var(--line)}
.logos img{max-width:100%;height:auto;background:#fff;padding:.5rem;border-radius:8px}
.logos .mc{width:230px} .logos .wc{width:250px} .logos .ci{width:210px}
.logos a{display:inline-block;line-height:0}
.logos a:hover img{opacity:.85}
.copy{font-size:.78rem;color:var(--muted);margin:.4rem 0 0}
details.res{margin-top:1.4rem} .body a{color:inherit}
.body a.loc,.body a.call{color:var(--bg)}
.body a.call{color:#fff}
.loc.missing{color:var(--miss)!important}
@media print{.sos,.crumbs,.actions,.theme-t,.logos{display:none!important}body{background:#fff;color:#000}details>*{display:block}summary::after{content:""}}
</style>
</head>

const app=document.getElementById("app");
const S={role:null,sit:null,view:"home",q:""};
const byId=(a,id)=>a.find(x=>x.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function locTag(key){
  const c=LOCAL[key]; if(!c) return "";
  if(c.tel) return `<a class="loc" href="tel:${esc(c.tel.replace(/\s/g,""))}">${esc(c.label)} ${esc(c.tel)}</a>`;
  if(c.mail) return `<a class="loc" href="mailto:${esc(c.mail)}">${esc(c.label)} ${esc(c.mail)}</a>`;
  if(c.url) return `<a class="loc" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.label)}</a>`;
  return `<span class="loc missing">${esc(c.label)} [kontakt doplňte]</span>`;
}
const rich=s=>esc(s)
  .replace(/\{(112|150|155|158)\}/g,'<a class="call" href="tel:$1">$1</a>')
  .replace(/\{(OSTRAHA|VRATNICE|KS|PORADNA)\}/g,(m,k)=>locTag(k.toLowerCase()))
  .replace(/&lt;b&gt;/g,"<b>").replace(/&lt;\/b&gt;/g,"</b>")
  .replace(/!{2,}/g,m=>`<span class="bang">${m}</span>`);
const sec=(arr,role)=>Array.isArray(arr)?arr:(arr?[...(arr["*"]||[]),...(arr[role]||[])]:[]);

function renderLocal(){
  document.getElementById("local").innerHTML='<span class="local-label">Krizová čísla FSv:</span>'+Object.values(LOCAL).filter(c=>!c.hideBar).map(c=>{
    const n=c.note?` <small>(${esc(c.note)})</small>`:"";
    if(c.tel) return `<span>${esc(c.label)}: <b>${esc(c.tel)}</b>${n}</span>`;
    if(c.mail) return `<span>${esc(c.label)}: <a href="mailto:${esc(c.mail)}">${esc(c.mail)}</a>${n}</span>`;
    return `<span>${esc(c.label)}: <span class="missing">[doplňte]</span></span>`;
  }).join("");
}
function go(v){S.view=v;render();window.scrollTo({top:0});const h=app.querySelector("h1");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true});}}
function crumbs(){
  const p=[`<button data-go="home">Úvod</button>`];
  if(S.role)p.push(`<button data-go="role">${esc(byId(ROLES,S.role).name)}</button>`);
  if(S.sit)p.push(`<button data-go="list">Situace</button>`);
  return `<nav class="crumbs" aria-label="Cesta">${p.join('<span class="sep">/</span>')}</nav>`;
}

role(){S.role=null;S.sit=null;
  return `${crumbs()}<h1>Vaše role</h1>
  <ul class="choices">${ROLES.map(r=>`<li><button class="choice" data-role="${r.id}"><span class="t">${esc(r.name)}</span><span class="d">${esc(r.desc)}</span></button></li>`).join("")}</ul>`;
},
list(){S.sit=null;
  const q=S.q.trim().toLowerCase();
  const items=SITUATIONS.filter(s=>!q||(s.name+" "+s.desc).toLowerCase().includes(q));
  const item=s=>`<li><button class="choice${s.crit?" crit":""}" ${s.ready?`data-sit="${s.id}"`:"disabled"}>
    <span class="t">${esc(s.name)}${s.ready?"":`<span class="tag">Připravuje se</span>`}</span>
    <span class="d">${esc(s.desc)}</span></button></li>`;
  return `${crumbs()}<h1>Krizová situace</h1>
  <label for="q" style="display:block;color:var(--muted);font-size:.93rem;margin-bottom:.3rem">Hledat situaci</label>
  <input id="q" class="filter" type="search" value="${esc(S.q)}" placeholder="např. útok, zásilka, laboratoř">
  <ul class="choices two">${items.map(item).join("")||"<li>Nic nenalezeno.</li>"}</ul>
  <p class="note">Červeně označené situace vyžadují okamžité jednání. </p>`;
},
guide(){
  const s=byId(SITUATIONS,S.sit), role=byId(ROLES,S.role);
  const steps=sec(s.first[S.role]||s.first.akad,S.role);
  const block=(h,arr,cls,open)=>{const it=sec(arr,S.role);return it.length?`<details class="${cls||""}"${open?" open":""}><summary>${esc(h)}</summary><div class="body"><ul>${it.map(i=>`<li>${rich(i)}</li>`).join("")}</ul></div></details>`:"";};
  const specs=Object.entries(s.spec||{}).filter(([k,v])=>ENV[k]&&v);
  return `${crumbs()}
  <h1>${esc(s.name)}</h1>
  <p class="lead">${esc(role.name)}</p>
  <div class="prio"><strong>Kdo co řídí</strong>${esc(PRIORITY)}</div>
  <div class="now">
    ${s.usb?`<div class="usb">${s.usb.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}
    <h2>První kroky</h2><ol class="first">${steps.map(i=>`<li>${rich(i)}</li>`).join("")}</ol>
  </div>
  ${specs.length?`<details><summary>Specifika prostředí</summary><div class="body">${specs.map(([k,v])=>`<div class="spec"><strong>${esc(ENV[k])}:</strong> ${rich(v)}</div>`).join("")}</div></details>`:""}
  ${s.warn?`<details class="warn" open><summary>${esc(s.warn.h)}</summary><div class="body"><ul>${s.warn.items.map(i=>`<li>${rich(i)}</li>`).join("")}</ul></div></details>`:""}
  ${block("Čeho se vyvarovat",s.dont,"dont")}
  ${block("Co zaznamenat a předat",s.record)}
  ${block("Po události",s.after)}
  ${s.ks?`<details class="ks"><summary>Kdy a jak aktivovat krizový štáb</summary><div class="body"><ul>${s.ks.map(i=>`<li>${rich(i)}</li>`).join("")}</ul>
    <p class="note">Podrobná činnost krizového štábu je v samostatném programu.</p></div></details>`:""}
  ${s.law?`<details><summary>Právní rámec</summary><div class="body"><div class="table-wrap"><table>
    <thead><tr><th scope="col">Předpis</th><th scope="col">Význam pro situaci</th></tr></thead>
    <tbody>${s.law.map(l=>`<tr><td>${esc(l[0])}</td><td>${esc(l[1])}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">Ověřeno k ${VERIFIED}.</p></div></details>`:""}
  ${(s.sources&&s.sources.length)||s.check?`<details><summary>Zdroje a metodické podklady</summary><div class="body">
    ${s.sources&&s.sources.length?`<ul>${s.sources.map(x=>`<li><a href="${LINKS[x[1]]}" target="_blank" rel="noopener">${esc(x[0])}</a></li>`).join("")}</ul>`:""}
    ${s.check?`<p class="checknote"><strong>Ověření mimo působnost Policie ČR:</strong> ${esc(s.check)}</p>`:""}
  </div></details>`:""}
  <div class="actions"><button class="btn primary" data-go="list">Jiná situace</button><button class="btn ghost" data-go="role">Jiná role</button><button class="btn ghost" data-act="print">Vytisknout</button></div>`;
}};

function render(){app.innerHTML=views[S.view]();}
app.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||b.disabled) return;
  if(b.id==="theme"){const r=document.documentElement;
    const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme=dark?"light":"dark";return;}
  const d=b.dataset;
  if(d.act==="print"){app.querySelectorAll("details").forEach(x=>x.open=true);window.print();return;}
  if(d.go)go(d.go);
  else if(d.role){S.role=d.role;S.q="";go("list");}
  else if(d.sit){S.sit=d.sit;go("guide");}
});
app.addEventListener("input",e=>{
  if(e.target.id!=="q")return;
  S.q=e.target.value;const pos=e.target.selectionStart;
  render();const i=document.getElementById("q");i.focus();i.setSelectionRange(pos,pos);
});
renderLocal();render();
</script>
</body>
